name: SGR Radar GDELT Refresh

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sgr-radar-gdelt-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh SGR news JSON
        run: python sgr-radar/fetch_gdelt.py

      - name: Commit changed data
        shell: bash
        run: |
          if git diff --quiet -- sgr-radar/data; then
            echo "No SGR data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sgr-radar/data
          git commit -m "Update SGR GDELT radar data"
          git pull --rebase origin main
          git push origin HEAD:main
