name: Check Cloudflare Deploy Credentials
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-cloudflare-creds-20261003.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check presence only
        shell: bash
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.CF_API_TOKEN }}
          D: ${{ secrets.CF_ACCOUNT_ID }}
          E: ${{ secrets.CLOUDFLARE_API_KEY }}
          F: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          test -n "$A" && echo CLOUDFLARE_API_TOKEN=YES || echo CLOUDFLARE_API_TOKEN=NO
          test -n "$B" && echo CLOUDFLARE_ACCOUNT_ID=YES || echo CLOUDFLARE_ACCOUNT_ID=NO
          test -n "$C" && echo CF_API_TOKEN=YES || echo CF_API_TOKEN=NO
          test -n "$D" && echo CF_ACCOUNT_ID=YES || echo CF_ACCOUNT_ID=NO
          test -n "$E" && echo CLOUDFLARE_API_KEY=YES || echo CLOUDFLARE_API_KEY=NO
          test -n "$F" && echo CLOUDFLARE_EMAIL=YES || echo CLOUDFLARE_EMAIL=NO
