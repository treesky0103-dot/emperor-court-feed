name: Manual HQ Refresh 2026-10-03
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-hq-refresh-20261003.yml'
  workflow_dispatch:

jobs:
  refresh-hq:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Refresh and verify today's HQ
        shell: bash
        run: |
          set -u
          BASE="https://emperor-court-gemini.memorywithu.workers.dev"
          echo "=== VERSION ==="
          curl -fsS --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' "$BASE/version?t=$(date +%s)" | tee version.json
          VERSION=$(jq -r '.version // empty' version.json)
          echo
          echo "LIVE_VERSION=$VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: no live version"
            exit 2
          fi

          echo "=== RELEASE BOOTSTRAP ==="
          curl -sS --retry 2 --retry-delay 2 -X POST -H 'Cache-Control: no-cache'             "$BASE/release-bootstrap?release=$VERSION&t=$(date +%s)" | tee bootstrap.json || true
          echo

          echo "=== MANUAL HQ REFRESH ==="
          curl -sS --retry 2 --retry-delay 2 -X POST -H 'Cache-Control: no-cache'             "$BASE/zhuge-hq-refresh?release=$VERSION&t=$(date +%s)" | tee refresh.json || true
          echo

          PASS=0
          for i in $(seq 1 36); do
            echo "=== VERIFY $i/36 ==="
            TS=$(date +%s)
            curl -fsS --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache'               "$BASE/morning-health?t=$TS" -o health.json || echo '{}' > health.json
            curl -fsS --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache'               "$BASE/zhuge-plan?ensure=0&quality=hq&surface=chatgpt&t=$TS" -o chatgpt.json || echo '{}' > chatgpt.json
            curl -fsS --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache'               "$BASE/zhuge-plan?ensure=0&quality=hq&surface=bubble&t=$TS" -o bubble.json || echo '{}' > bubble.json

            echo "-- health --"; jq -c '{version,build,day,planSetId,plans,cardnews,covers,morningEdition}' health.json 2>/dev/null || cat health.json
            echo "-- chatgpt --"; jq -c '{ok,pending,hqOnly,qualityContract,currentDay,displayDay,todayHq,holdLastVerifiedHq,planSetId,contentRevision,titles:(.threePlans.plans // .plans // [] | map(.title))}' chatgpt.json 2>/dev/null || cat chatgpt.json
            echo "-- bubble --"; jq -c '{ok,pending,hqOnly,qualityContract,currentDay,displayDay,todayHq,holdLastVerifiedHq,planSetId,contentRevision,titles:(.threePlans.plans // .plans // [] | map(.title))}' bubble.json 2>/dev/null || cat bubble.json

            if jq -e --slurpfile c chatgpt.json --slurpfile b bubble.json '
              ($c[0].ok == true) and
              ($b[0].ok == true) and
              ($c[0].hqOnly == true) and
              ($b[0].hqOnly == true) and
              ($c[0].qualityContract == "verified-hq-only-v215100") and
              ($b[0].qualityContract == "verified-hq-only-v215100") and
              ($c[0].todayHq == true) and
              ($b[0].todayHq == true) and
              (($c[0].contentRevision // "") != "") and
              ($c[0].contentRevision == $b[0].contentRevision) and
              ($c[0].planSetId == $b[0].planSetId) and
              (($c[0].threePlans.plans | map(.title)) == ($b[0].threePlans.plans | map(.title))) and
              (.plans.hqReady == true) and
              (.plans.verifiedHqRevision == $c[0].contentRevision) and
              (.cardnews.hqReady == true) and
              (.cardnews.matchesPlanRevision == true) and
              (.covers.hqReady == true) and
              (.covers.matchesPlanRevision == true)
            ' health.json >/dev/null 2>&1; then
              PASS=1
              echo "DUAL_SURFACE_HQ_PASS"
              echo "PLAN_SET=$(jq -r '.planSetId' chatgpt.json)"
              echo "REVISION=$(jq -r '.contentRevision' chatgpt.json)"
              jq -r '(.threePlans.plans // .plans // [])[] | "TITLE=" + (.title // "")' chatgpt.json
              break
            fi
            sleep 10
          done

          if [ "$PASS" -ne 1 ]; then
            echo "DUAL_SURFACE_HQ_FAIL"
            echo "FINAL_VERSION=$VERSION"
            exit 3
          fi
