name: Force Cardnews HQ 2026-10-03
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-cardnews-hq-20261003.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Force cardnews ensure and inspect cover status
        shell: bash
        run: |
          set +e
          BASE="https://emperor-court-gemini.memorywithu.workers.dev"
          C="curl -sS --connect-timeout 5 --max-time 20 --retry 1 -H Cache-Control:no-cache"
          echo "=== CARD ENSURE ==="
          $C -X POST "$BASE/zhuge-cardnews/ensure?t=$(date +%s)"
          echo
          sleep 12
          echo "=== CARD STATUS ==="
          $C "$BASE/zhuge-cardnews/status?t=$(date +%s)"
          echo
          echo "=== COVER STATUS ==="
          $C "$BASE/zhuge-coverrefs/status?t=$(date +%s)"
          echo
          echo "=== HEALTH ==="
          $C "$BASE/morning-health?t=$(date +%s)" | jq -c '{version,day,planSetId,plans,cardnews,covers,morningEdition}'
