name: HQ Refresh Probe 2026-10-03
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hq-refresh-probe-20261003.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live Worker and force refresh
        shell: bash
        run: |
          set +e
          BASE="https://emperor-court-gemini.memorywithu.workers.dev"
          echo "=== VERSION ==="
          VER=$(curl -fsS --retry 2 -H 'Cache-Control: no-cache' "$BASE/version?t=$(date +%s)")
          echo "$VER"
          VERSION=$(printf '%s' "$VER" | jq -r '.version // empty')
          echo "LIVE_VERSION=$VERSION"
          echo "=== BOOTSTRAP ==="
          curl -sS --retry 2 -X POST "$BASE/release-bootstrap?release=$VERSION&t=$(date +%s)"
          echo
          echo "=== HQ REFRESH ==="
          curl -sS --retry 2 -X POST "$BASE/zhuge-hq-refresh?release=$VERSION&t=$(date +%s)"
          echo
          sleep 8
          echo "=== HEALTH ==="
          curl -fsS --retry 2 -H 'Cache-Control: no-cache' "$BASE/morning-health?t=$(date +%s)" | jq -c '{version,build,day,planSetId,plans,cardnews,covers,morningEdition}'
          echo "=== CHATGPT ==="
          curl -fsS --retry 2 -H 'Cache-Control: no-cache' "$BASE/zhuge-plan?ensure=0&quality=hq&surface=chatgpt&t=$(date +%s)" | jq -c '{ok,pending,hqOnly,qualityContract,currentDay,displayDay,todayHq,holdLastVerifiedHq,planSetId,contentRevision,publisherVersion,titles:(.threePlans.plans // .plans // [] | map(.title))}'
          echo "=== BUBBLE ==="
          curl -fsS --retry 2 -H 'Cache-Control: no-cache' "$BASE/zhuge-plan?ensure=0&quality=hq&surface=bubble&t=$(date +%s)" | jq -c '{ok,pending,hqOnly,qualityContract,currentDay,displayDay,todayHq,holdLastVerifiedHq,planSetId,contentRevision,publisherVersion,titles:(.threePlans.plans // .plans // [] | map(.title))}'
